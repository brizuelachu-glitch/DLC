<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members Tracker</title>

<style>
body { 
    font-family: Arial;
    background: #f4f4f4;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
}

.container {
    max-width: 600px;
    margin: auto;
}

input, select, button {
    width: 100%;
    padding: 10px;
    margin: 5px 0;
}

button {
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}

.card {
    background: white;
    padding: 10px;
    margin-top: 10px;
    border-radius: 5px;
}

.unpaid {
    border-left: 5px solid red;
}

.paid {
    border-left: 5px solid green;
}
</style>
</head>

<body>

<div class="container">

<h2>Members Tracker</h2>

<!-- INPUT -->
<input type="text" id="name" placeholder="Member Name">
<input type="text" id="reason" placeholder="Reason (if unpaid)">
<select id="status">
    <option value="unpaid">Unpaid</option>
    <option value="paid">Paid</option>
</select>

<button onclick="addMember()">Add Member</button>

<!-- LIST -->
<h3>Unpaid Members</h3>
<div id="unpaidList"></div>

</div>

<script>
let members = JSON.parse(localStorage.getItem("members")) || [];

function addMember() {
    let name = document.getElementById("name").value;
    let reason = document.getElementById("reason").value;
    let status = document.getElementById("status").value;

    if (name === "") {
        alert("Enter a name");
        return;
    }

    members.push({
        name: name,
        reason: status === "paid" ? "" : reason,
        status: status
    });

    localStorage.setItem("members", JSON.stringify(members));

    document.getElementById("name").value = "";
    document.getElementById("reason").value = "";

    displayMembers();
}

function displayMembers() {
    let unpaidDiv = document.getElementById("unpaidList");
    unpaidDiv.innerHTML = "";

    members.forEach(m => {
        if (m.status === "unpaid") {
            unpaidDiv.innerHTML += `
                <div class="card unpaid">
                    <b>${m.name}</b><br>
                    Reason: ${m.reason || "No reason"}
                </div>
            `;
        }
    });
}

displayMembers();
</script>

</body>
</html>
