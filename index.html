<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DLC Funds</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #0f172a;
    color: white;
}

/* TABS */
.tab {
    display: flex;
    background: #1e293b;
}
.tab button {
    flex: 1;
    padding: 12px;
    border: none;
    background: none;
    color: white;
}

/* INPUTS */
input, button {
    width: 90%;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
    border: none;
}

button { background: #2563eb; color: white; }

/* PAGES */
.page { display: none; padding: 15px; }
.active { display: block; }

/* CARD */
.card {
    background: #1e293b;
    padding: 10px;
    margin: 10px;
    border-radius: 10px;
}
</style>
</head>

<body>

<h2 style="text-align:center;">Drum & Lyre Funds</h2>

<!-- TABS -->
<div class="tab">
<button onclick="show('home')">Funds</button>
<button onclick="show('add')">Add</button>
<button onclick="show('history')">History</button>
<button onclick="show('members')">Members</button>
</div>

<!-- HOME -->
<div id="home" class="page active">
    <h1 id="total">₱0</h1>
</div>

<!-- ADD -->
<div id="add" class="page">
    <input id="member" placeholder="Member">
    <input id="reason" placeholder="Reason">
    <input id="amount" type="number" placeholder="Amount">
    <label><input type="checkbox" id="exp"> Expense</label>
    <button onclick="save()">Save</button>
</div>

<!-- HISTORY -->
<div id="history" class="page">
    <div id="list"></div>
</div>

<!-- MEMBERS -->
<div id="members" class="page">
    <h3>Members</h3>

    <input id="newMember" placeholder="Add member name">
    <button onclick="addMember()">Add Member</button>

    <div id="memberList"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("funds")) || [];
let members = JSON.parse(localStorage.getItem("members")) || [];

// SAVE TRANSACTION
function save() {
    let m = document.getElementById("member").value;
    let r = document.getElementById("reason").value;
    let a = parseFloat(document.getElementById("amount").value);
    let e = document.getElementById("exp").checked;

    if (!m || !r || !a) return;

    if (e) a = -a;

    data.push({m,r,a,date:new Date().toLocaleString()});
    localStorage.setItem("funds", JSON.stringify(data));

    render();
}

// RENDER FUNDS + HISTORY
function render() {
    let total = data.reduce((s,i)=>s+i.a,0);
    document.getElementById("total").innerText = "₱"+total;

    let list = document.getElementById("list");
    list.innerHTML="";

    data.slice().reverse().forEach(i=>{
        let div=document.createElement("div");
        div.className="card";
        div.innerHTML=`
        <b>${i.m}</b><br>
        ${i.r}<br>
        ₱${i.a}<br>
        <small>${i.date}</small>`;
        list.appendChild(div);
    });

    renderMembers();
}

// ADD MEMBER
function addMember() {
    let name = document.getElementById("newMember").value;
    if (!name) return;

    members.push(name);
    localStorage.setItem("members", JSON.stringify(members));

    document.getElementById("newMember").value = "";
    renderMembers();
}

// SHOW MEMBERS + STATUS
function renderMembers() {
    let list = document.getElementById("memberList");
    list.innerHTML = "";

    members.forEach(name => {
        let paid = data.some(t => t.m === name && t.a > 0);

        let div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
        <b>${name}</b><br>
        <span style="color:${paid ? 'lightgreen' : 'red'}">
        ${paid ? 'Paid' : 'Not Paid'}
        </span>
        `;

        list.appendChild(div);
    });
}

// TAB SWITCH
function show(page) {
    document.querySelectorAll(".page").forEach(p => p.classList.remove("active"));
    document.getElementById(page).classList.add("active");
}

render();
</script>

</body>
</html>
