<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Members Tracker</title>

<style>
body {
    font-family: Arial;
    margin: 0;
    background: #f2f2f2;
}

.header {
    display: flex;
    justify-content: space-around;
    background: #333;
}

.tab {
    flex: 1;
    padding: 15px;
    color: white;
    text-align: center;
    cursor: pointer;
}

.tab.active {
    background: green;
}

.section {
    display: none;
    padding: 20px;
}

.section.active {
    display: block;
}

input {
    padding: 10px;
    margin: 5px;
    width: 90%;
}

button {
    padding: 10px;
    background: green;
    color: white;
    border: none;
    width: 95%;
    margin-top: 5px;
}

.card {
    background: white;
    padding: 10px;
    margin: 10px 0;
    border-radius: 5px;
}
</style>
</head>

<body>

<div class="header">
    <div class="tab active" onclick="showTab('paid')">💰 Paid</div>
    <div class="tab" onclick="showTab('unpaid')">❌ Unpaid</div>
    <div class="tab" onclick="showTab('history')">📊 History</div>
</div>

<!-- PAID -->
<div id="paid" class="section active">
    <h3>Paid Members</h3>
    <input id="pName" placeholder="Name">
    <input id="pAmount" placeholder="Amount paid">
    <button onclick="addPaid()">Add Paid</button>
    <div id="paidList"></div>
</div>

<!-- UNPAID -->
<div id="unpaid" class="section">
    <h3>Unpaid Members</h3>
    <input id="uName" placeholder="Name">
    <input id="uReason" placeholder="Reason">
    <button onclick="addUnpaid()">Add Unpaid</button>
    <div id="unpaidList"></div>
</div>

<!-- HISTORY -->
<div id="history" class="section">
    <h3>History</h3>
    <div id="historyList"></div>
</div>

<script>
let paid = JSON.parse(localStorage.getItem("paid")) || [];
let unpaid = JSON.parse(localStorage.getItem("unpaid")) || [];

function save() {
    localStorage.setItem("paid", JSON.stringify(paid));
    localStorage.setItem("unpaid", JSON.stringify(unpaid));
}

// Tabs
function showTab(tab) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

// PAID
function addPaid() {
    let name = document.getElementById("pName").value;
    let amount = document.getElementById("pAmount").value;

    if (!name || !amount) return;

    paid.push({ name, amount, date: new Date().toLocaleString() });
    save();
    render();
}

// UNPAID
function addUnpaid() {
    let name = document.getElementById("uName").value;
    let reason = document.getElementById("uReason").value;

    if (!name || !reason) return;

    unpaid.push({ name, reason, date: new Date().toLocaleString() });
    save();
    render();
}

// DISPLAY
function render() {

    document.getElementById("paidList").innerHTML =
        paid.map(p =>
            `<div class="card">${p.name} - ₱${p.amount}<br><small>${p.date}</small></div>`
        ).join("");

    document.getElementById("unpaidList").innerHTML =
        unpaid.map(u =>
            `<div class="card">${u.name} - ${u.reason}<br><small>${u.date}</small></div>`
        ).join("");

    document.getElementById("historyList").innerHTML =
        `
        <h4>Paid: ${paid.length}</h4>
        <h4>Unpaid: ${unpaid.length}</h4>
        `;
}

render();
</script>

</body>
</html>
