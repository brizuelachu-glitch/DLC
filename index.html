<!DOCTYPE html>
<html>
<head> 
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Unpaid Members List</title>

<style>
body {
    font-family: Arial, sans-serif;
    background: #f2f2f2;
    margin: 0;
    padding: 20px;
}

h2 {
    text-align: center;
}

table {
    width: 100%;
    border-collapse: collapse;
    background: white;
    margin-top: 20px;
}

th, td {
    border: 1px solid #ddd;
    padding: 10px;
    text-align: left;
}

th {
    background: #333;
    color: white;
}

tr:nth-child(even) {
    background: #f9f9f9;
}

.add-box {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

input {
    padding: 10px;
    flex: 1;
    min-width: 120px;
}

button {
    padding: 10px 15px;
    background: green;
    color: white;
    border: none;
    cursor: pointer;
}
</style>
</head>

<body>

<h2>Unpaid Members Tracker</h2>

<table id="table">
<tr>
    <th>Name</th>
    <th>Reason</th>
</tr>
</table>

<div class="add-box">
    <input type="text" id="name" placeholder="Member Name">
    <input type="text" id="reason" placeholder="Reason for not paying">
    <button onclick="addRow()">Add</button>
</div>

<script>
function addRow() {
    let name = document.getElementById("name").value;
    let reason = document.getElementById("reason").value;

    if (name === "" || reason === "") {
        alert("Please fill all fields");
        return;
    }

    let table = document.getElementById("table");

    let row = table.insertRow();
    let cell1 = row.insertCell(0);
    let cell2 = row.insertCell(1);

    cell1.innerHTML = name;
    cell2.innerHTML = reason;

    document.getElementById("name").value = "";
    document.getElementById("reason").value = "";
}
</script>

</body>
</html>
