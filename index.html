<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Funds Tracker</title>

<style>
body {
    margin: 0;
    font-family: Arial;
    background: linear-gradient(135deg, #070a1f, #111a3a, #2b1b5a);
    color: white;
}

/* HEADER */
.header {
    display: flex;
    background: #0d1433;
}

.tab {
    flex: 1;
    text-align: center;
    padding: 15px;
    cursor: pointer;
    color: #cfd6ff;
}

.tab.active {
    background: linear-gradient(90deg, #3a3fff, #7a3fff);
    color: white;
}

/* SECTIONS */
.section {
    display: none;
    padding: 20px;
}

.section.active {
    display: block;
}

/* INPUTS */
input {
    width: 100%;
    padding: 12px;
    margin: 5px 0;
    border: none;
    border-radius: 8px;
    background: #121a3d;
    color: white;
}

/* BUTTON */
button {
    width: 100%;
    padding: 12px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(90deg, #3a3fff, #7a3fff);
    color: white;
    cursor: pointer;
    margin-top: 5px;
}

/* CARD */
.card {
    background: rgba(255,255,255,0.06);
    padding: 10px;
    margin: 10px 0;
    border-radius: 10px;
    border-left: 4px solid #7a3fff;
}

/* SUMMARY */
.summary {
    background: rgba(255,255,255,0.08);
    padding: 15px;
    border-radius: 10px;
}
</style>
</head>

<body>

<div class="header">
    <div class="tab active" onclick="showTab('paid')">💰 Paid</div>
    <div class="tab" onclick="showTab('unpaid')">❌ Unpaid</div>
    <div class="tab" onclick="showTab('history')">📊 Summary</div>
</div>

<!-- PAID -->
<div id="paid" class="section active">
    <h2>Paid Members</h2>

    <input id="pName" placeholder="Name">
    <input id="pAmount" placeholder="Amount paid">

    <input id="subAmount" placeholder="Subtract amount">
    <input id="subReason" placeholder="Reason for subtraction">

    <button onclick="addPaid()">Add Paid</button>
    <button onclick="subtract()">➖ Subtract Funds</button>

    <div id="paidList"></div>
</div>

<!-- UNPAID -->
<div id="unpaid" class="section">
    <h2>Unpaid Members</h2>

    <input id="uName" placeholder="Name">
    <input id="uReason" placeholder="Reason">
    <button onclick="addUnpaid()">Add Unpaid</button>

    <div id="unpaidList"></div>
</div>

<!-- SUMMARY -->
<div id="history" class="section">
    <h2>Funds Summary</h2>

    <div class="summary" id="summaryBox"></div>
</div>

<script>

let paid = JSON.parse(localStorage.getItem("paid")) || [];
let unpaid = JSON.parse(localStorage.getItem("unpaid")) || [];
let subtractions = JSON.parse(localStorage.getItem("subtractions")) || [];

/* SAVE */
function save() {
    localStorage.setItem("paid", JSON.stringify(paid));
    localStorage.setItem("unpaid", JSON.stringify(unpaid));
    localStorage.setItem("subtractions", JSON.stringify(subtractions));
}

/* TABS */
function showTab(tab) {
    document.querySelectorAll(".section").forEach(s => s.classList.remove("active"));
    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));

    document.getElementById(tab).classList.add("active");
    event.target.classList.add("active");
}

/* ADD PAID */
function addPaid() {
    let name = document.getElementById("pName").value;
    let amount = Number(document.getElementById("pAmount").value);

    if (!name || !amount) return;

    paid.push({ name, amount });
    save();
    render();
}

/* ADD UNPAID */
function addUnpaid() {
    let name = document.getElementById("uName").value;
    let reason = document.getElementById("uReason").value;

    if (!name || !reason) return;

    unpaid.push({ name, reason });
    save();
    render();
}

/* SUBTRACT FUNDS */
function subtract() {
    let amount = Number(document.getElementById("subAmount").value);
    let reason = document.getElementById("subReason").value;

    if (!amount) return;

    subtractions.push({ amount, reason });
    save();
    render();
}

/* TOTAL */
function getTotal() {
    let totalPaid = paid.reduce((sum, p) => sum + Number(p.amount), 0);
    let totalSub = subtractions.reduce((sum, s) => sum + Number(s.amount), 0);

    return totalPaid - totalSub;
}

/* RENDER */
function render() {

    document.getElementById("paidList").innerHTML =
        paid.map(p =>
            `<div class="card">💰 ${p.name} — ₱${p.amount}</div>`
        ).join("");

    document.getElementById("unpaidList").innerHTML =
        unpaid.map(u =>
            `<div class="card">❌ ${u.name} — ${u.reason}</div>`
        ).join("");

    let subList = subtractions.map(s =>
        `<div class="card">➖ ₱${s.amount} — ${s.reason || "No reason"}</div>`
    ).join("");

    document.getElementById("summaryBox").innerHTML = `
        💰 Total Funds: ₱${getTotal()} <br><br>
        📥 Paid Entries: ${paid.length} <br>
        📤 Subtractions: ${subtractions.length} <br>
        ❌ Unpaid: ${unpaid.length}
        <br><br>
        <h3>Expenses</h3>
        ${subList}
    `;
}

render();

</script>

</body>
</html>
